<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Feedback Survey</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #10b981;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .header h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 2.5rem;
      margin-bottom: 12px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header p {
      font-size: 1.1rem;
      opacity: 0.95;
      font-weight: 500;
    }

    form {
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-group {
      margin-bottom: 28px;
    }

    .form-group:last-of-type {
      margin-bottom: 32px;
    }

    label {
      display: block;
      font-weight: 600;
      color: #1a202c;
      margin-bottom: 10px;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: #f7fafc;
    }

    input[type="text"]:hover,
    select:hover,
    textarea:hover {
      border-color: #cbd5e0;
      background: #fff;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #10b981;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 120px;
      font-family: inherit;
    }

    fieldset {
      margin-bottom: 28px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      background: #f7fafc;
      transition: all 0.3s ease;
    }

    fieldset:hover {
      border-color: #cbd5e0;
      background: #fff;
    }

    legend {
      font-weight: 600;
      color: #1a202c;
      padding: 0 10px;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .radio-option {
      display: flex;
      align-items: center;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .radio-option:hover {
      background: #edf2f7;
    }

    .radio-option input[type="radio"] {
      margin-right: 12px;
      cursor: pointer;
      width: 18px;
      height: 18px;
      accent-color: #10b981;
    }

    .radio-option label {
      margin-bottom: 0;
      cursor: pointer;
      font-weight: 500;
      flex: 1;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .success-message {
      display: none;
      padding: 16px;
      background: #c6f6d5;
      color: #22543d;
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid #9ae6b4;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-message {
      display: none;
      padding: 16px;
      background: #fed7d7;
      color: #742a2a;
      border-radius: 8px;
      margin-top: 20px;
      border: 1px solid #fc8181;
    }

    @media (max-width: 600px) {
      form {
        padding: 24px;
      }

      .header h1 {
        font-size: 1.8rem;
      }

      .header p {
        font-size: 1rem;
      }

      label {
        font-size: 0.9rem;
      }
    }

    input:invalid:not(:placeholder-shown) {
      border-color: #fc8181;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Customer Feedback</h1>
    <p>We'd love to hear your thoughts</p>
  </div>

  <form id="googleForm" novalidate>
    <div class="form-group">
      <label for="name">Full Name <span style="color: #10b981;">*</span></label>
      <input type="text" name="name" id="name" placeholder="John Doe" required aria-required="true">
    </div>

    <div class="form-group">
      <label for="gender">Gender <span style="color: #10b981;">*</span></label>
      <select name="gender" id="gender" required aria-required="true">
        <option value="">Select an option</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
        <option value="Prefer not to say">Prefer not to say</option>
      </select>
    </div>

    <fieldset>
      <legend>Age Group <span style="color: #10b981;">*</span></legend>
      <div class="radio-group" role="group" aria-labelledby="ageGroup">
        <div class="radio-option">
          <input type="radio" name="ageGroup" id="age1" value="Under 18" required>
          <label for="age1">Under 18</label>
        </div>
        <div class="radio-option">
          <input type="radio" name="ageGroup" id="age2" value="18-30" required>
          <label for="age2">18-30</label>
        </div>
        <div class="radio-option">
          <input type="radio" name="ageGroup" id="age3" value="31-50" required>
          <label for="age3">31-50</label>
        </div>
        <div class="radio-option">
          <input type="radio" name="ageGroup" id="age4" value="51+" required>
          <label for="age4">51+</label>
        </div>
      </div>
    </fieldset>

    <div class="form-group">
      <label for="comments">Additional Comments</label>
      <textarea name="comments" id="comments" placeholder="Share your feedback with us..." aria-label="Additional comments"></textarea>
    </div>

    <button type="submit" id="submitBtn">Submit Feedback</button>
    
    <div class="success-message" id="successMessage">
      ✓ Thank you! Your feedback has been submitted successfully.
    </div>
    
    <div class="error-message" id="errorMessage">
      ✗ Something went wrong. Please try again.
    </div>
  </form>
</div>

<script>
  // Google Apps Script endpoint
  const scriptURL = 'https://script.google.com/macros/s/AKfycbyVzj1Ip87-vwARqSU9oD9alTNCBd118Xa7Au8LzLCLW1O5wxBadzEcnsRH8dGjl7iG/exec';
  const form = document.getElementById('googleForm');
  const submitBtn = document.getElementById('submitBtn');
  const successMessage = document.getElementById('successMessage');
  const errorMessage = document.getElementById('errorMessage');

  // Form submission handler with enhanced UX
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Validate form
    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    // Check if at least one radio button is selected
    const ageGroupChecked = document.querySelector('input[name="ageGroup"]:checked');
    if (!ageGroupChecked) {
      alert('Please select an age group');
      return;
    }

    // Show loading state
    const originalText = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spinner"></span>Submitting...';
    successMessage.style.display = 'none';
    errorMessage.style.display = 'none';

    try {
      const response = await fetch(scriptURL, {
        method: 'POST',
        body: new FormData(form)
      });

      if (!response.ok) throw new Error('Network response was not ok');

      // Success state
      successMessage.style.display = 'block';
      form.reset();
      submitBtn.innerHTML = originalText;
      submitBtn.disabled = true;

      // Re-enable button after 3 seconds
      setTimeout(() => {
        submitBtn.disabled = false;
        successMessage.style.display = 'none';
      }, 3000);

    } catch (error) {
      console.error('Error:', error);
      errorMessage.style.display = 'block';
      submitBtn.innerHTML = originalText;
      submitBtn.disabled = false;
    }
  });

  // Re-enable submit button when form changes
  form.addEventListener('change', () => {
    if (successMessage.style.display === 'none') {
      submitBtn.disabled = false;
    }
  });

  form.addEventListener('input', () => {
    if (successMessage.style.display === 'none') {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
